name: Shared read-only geometry source
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  exact-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: |
          bash build.sh
          mkdir -p build/shared-source
          javac -d build/shared-source android-graphics/shared/x/gpu/virtual/CompactTriangleStream.java android-graphics/host/SharedTriangleBufferTest.java
          java -cp build/shared-source SharedTriangleBufferTest
