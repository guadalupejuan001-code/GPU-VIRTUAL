name: GPU - base oficial C12

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el historial completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar version, componentes y origen de la rama
        env:
          GPU_CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-gpu-baseline.py --head "$GPU_CHECK_HEAD"
